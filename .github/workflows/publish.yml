name: Publish

on:
  release:
    types: [published]

# Two releases published close together must not race to overwrite `latest`;
# an in-flight push is never cancelled half-way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # pushing to GHCR

    steps:
      - uses: actions/checkout@v5

      # The Dockerfile builds with CGO_ENABLED=0, so arm64 cross-compiles
      # without an emulator — QEMU is only needed for the alpine runtime layer's
      # `apk add`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is only applied here, on a published release, so it never
      # points at an untagged commit from main.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
